name: Bayan SLM CI

# Run once per PR (pull_request) and once on main merges (push).
# Avoids double runs when pushing to a PR branch.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  static-analysis-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes only exact release tags (no mutable major like v9);
      # pin the exact release to avoid 'unable to find version v9' at resolve time.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
      # Deterministic install against the committed lock (cu129 wheels).
      # --frozen fails the build on any lock drift instead of silently re-resolving.
      - name: Install dependencies (frozen)
        run: uv sync --frozen --group dev
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: MyPy (strict src + relaxed tests, two-tier)
        run: uv run mypy
      - name: Execute Shape-Driven Pytest (CPU only, hermetic)
        run: BAYAN_OFFLINE=1 uv run pytest tests/
